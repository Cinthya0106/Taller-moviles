name: taller_movilidad
description: Taller de Flutter - Geolocalización (OpenStreetMap), Sensores y Notificaciones
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  # Mapas open source (igual que el ejemplo Talleres/mapas del profesor)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^11.0.0
  sensors_plus: ^5.0.1
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  vibration: ^3.1.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
